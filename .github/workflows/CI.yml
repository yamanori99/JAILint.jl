name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # New optional check; owner may add to branch protection after burn-in.
  whitespace:
    name: Repository whitespace - ubuntu-latest - x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trailing newlines and diff whitespace
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/whitespace-gate.sh

  runic:
    name: Runic formatting - Julia 1.13 - ubuntu-latest - x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - name: Runic pin
        id: runic-pin
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n -E 's/^Runic = "=([^"]+)".*/\1/p' .github/runic/Project.toml | head -1)"
          if [[ ! "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ".github/runic/Project.toml: Runic compat pin missing or invalid" >&2
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - uses: fredrikekre/runic-action@b4dbd650db5cc684baae27fea45d22daf41693c2 # v1.5.0
        with:
          version: ${{ steps.runic-pin.outputs.version }}

  aqua:
    name: Aqua - Julia 1.13 - ubuntu-latest - x64
    permissions:
      contents: read
      actions: write # julia-depot-cache save on main push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Aqua.test_all (latest Aqua)
        run: ./.github/aqua-check.sh

  # JETLS depot: restore every run; save on main push only. Exact hit skips Pkg.Apps.add.
  jetls:
    name: JETLS - Julia 1.13 - ubuntu-latest - x64
    permissions:
      contents: read
      actions: write # JETLS depot cache save on main push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULIA_CPU_TARGET: "generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: files
        run: echo "list=$(./.github/jetls-check.sh --print-files)" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - name: Log runner CPU
        id: runner
        run: |
          set -euo pipefail
          julia --startup-file=no -e 'println("CPU_NAME=", Sys.CPU_NAME); println("CPU_MODEL=", Sys.cpu_info()[1].model)'
          ver="$(julia --startup-file=no -e 'print(VERSION)')"
          tag="$(printf '%s' "$JULIA_CPU_TARGET" | sha256sum | cut -c1-12)"
          echo "julia=${ver}" >> "$GITHUB_OUTPUT"
          echo "cputarget=${tag}" >> "$GITHUB_OUTPUT"
          echo "jetls-cache: julia=${ver} cputarget=${tag}"

      - name: JETLS pin
        id: jetls-rev
        run: |
          set -euo pipefail
          rev="$(tr -d '[:space:]' < .github/jetls-rev)"
          if [[ ! "${rev}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "jetls job: date pin missing or invalid in .github/jetls-rev" >&2
            exit 1
          fi
          echo "rev=${rev}" >> "${GITHUB_OUTPUT}"

      - name: Restore JETLS depot cache
        id: jetls-depot-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/registries
            ~/.julia/environments/apps
            ~/.julia/bin
          key: jetls-depot-${{ runner.os }}-${{ steps.runner.outputs.julia }}-${{ steps.runner.outputs.cputarget }}-${{ steps.jetls-rev.outputs.rev }}
          restore-keys: |
            jetls-depot-${{ runner.os }}-${{ steps.runner.outputs.julia }}-${{ steps.runner.outputs.cputarget }}-${{ steps.jetls-rev.outputs.rev }}-

      - uses: ./.github/actions/jetls-check # zizmor: ignore[self-repository]
        with:
          files: ${{ steps.files.outputs.list }}
          depot-cache-exact: ${{ steps.jetls-depot-cache.outputs.cache-hit == 'true' }}

      - name: Save JETLS depot cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.jetls-depot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
            ~/.julia/registries
            ~/.julia/environments/apps
            ~/.julia/bin
          key: ${{ steps.jetls-depot-cache.outputs.cache-primary-key }}

  test_pre_shard:
    name: Pkg.test (shard ${{ matrix.shard }}/3) - Julia 1.14-pre - ubuntu-latest - x64
    continue-on-error: true
    needs: [runic, aqua, jetls]
    permissions:
      contents: read
      actions: write # julia-depot-cache save on main push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGENTRULELINT_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "~1.14.0-0"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Instantiate Runic test env
        shell: bash
        run: julia --startup-file=no --project=test/runic_env -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run tests (optional pre-release Julia)
        shell: bash
        run: julia --startup-file=no --project=. --color=yes -e 'using Pkg; Pkg.test()'

  # Sharded 1/3..3/3; not a required check — aggregate `test` below is.
  test_shard:
    name: Pkg.test (shard ${{ matrix.shard }}/3) - Julia 1.13 - ubuntu-latest - x64
    needs: [runic, aqua, jetls]
    permissions:
      contents: read
      actions: write # julia-depot-cache save on main push
      id-token: write # Codecov OIDC on main push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGENTRULELINT_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Instantiate Runic test env
        shell: bash
        run: julia --startup-file=no --project=test/runic_env -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run tests (Aqua + Runic invariance in test suite)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            julia --startup-file=no --project=. --color=yes -e 'using Pkg; Pkg.test(; coverage=true)'
          else
            julia --startup-file=no --project=. --color=yes -e 'using Pkg; Pkg.test()'
          fi
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          directories: src
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          slug: ${{ github.repository }}
          use_oidc: true
          fail_ci_if_error: true
          flags: shard-${{ matrix.shard }}

  test:
    name: Pkg.test - Julia 1.13 - ubuntu-latest - x64
    needs: [test_shard]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all Pkg.test shards successful
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.test_shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "test_shard result was $SHARD_RESULT (expected success)" >&2
            exit 1
          fi

  # Sharded 1/3..3/3; not a required check — aggregate `mutation` below is.
  # No path filter: every PR runs every `test/mutation/*.jl` harness (#75).
  mutation_shard:
    name: Mutation tests (shard ${{ matrix.shard }}/3) - Julia 1.13 - ubuntu-latest - x64
    needs: [runic, aqua, jetls]
    permissions:
      contents: read
      actions: write # julia-depot-cache save on main push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGENTRULELINT_MUTATION_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run mutation harnesses
        shell: bash
        run: julia --startup-file=no --project=. test/mutation/run_all.jl

  # Required check candidate (owner must add the job name to branch protection).
  mutation:
    name: Mutation tests - Julia 1.13 - ubuntu-latest - x64
    needs: [mutation_shard]
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all mutation shards successful
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.mutation_shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "mutation_shard result was $SHARD_RESULT (expected success)" >&2
            exit 1
          fi

  mutation-pre:
    # Non-required while Julia 1.14 is a pre-release; early signal for mutation harnesses on upcoming Julia.
    continue-on-error: true
    name: Mutation tests (shard ${{ matrix.shard }}/3) - Julia 1.14-pre - ubuntu-latest - x64
    needs: [runic, aqua, jetls]
    permissions:
      contents: read
      actions: write # julia-depot-cache save on main push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      AGENTRULELINT_MUTATION_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "~1.14.0-0"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Instantiate main project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run mutation harnesses
        shell: bash
        run: julia --startup-file=no --project=. test/mutation/run_all.jl

  # Non-required until #70: fails on protected-path / policy diffs by design (#71).
  dogfood:
    name: AgentRuleLint.jl (dogfood) - Julia 1.13 - ubuntu-latest - x64
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13"

      - uses: ./.github/actions/julia-depot-cache # zizmor: ignore[self-repository]
        with:
          cache-scratchspaces: false

      - name: Checkout base linter worktree
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_BASE_REF:?GITHUB_BASE_REF unset (pull_request only)}"
          git fetch origin "${GITHUB_BASE_REF}"
          if [[ -e .linter-base ]]; then
            git worktree remove -f .linter-base
          fi
          git worktree add .linter-base "origin/${GITHUB_BASE_REF}"
          linter_sha="$(git -C .linter-base rev-parse HEAD)"
          base_tip="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          echo "dogfood linter commit: ${linter_sha}"
          echo "dogfood base tip: ${base_tip}"
          [[ "${linter_sha}" == "${base_tip}" ]]

      - name: Instantiate base linter project
        shell: bash
        run: julia --startup-file=no --project=.linter-base -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: AgentRuleLint.jl check (dogfood)
        shell: bash
        env:
          DOGFOOD_DIR: ${{ runner.temp }}/dogfood
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          : "${GITHUB_BASE_REF:?GITHUB_BASE_REF unset (pull_request only)}"
          mkdir -p "${DOGFOOD_DIR}"
          base_sha="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          echo "dogfood merge-base: ${base_sha}"
          linter_sha="$(git -C .linter-base rev-parse HEAD)"
          pkg_version="$(sed -n -E 's/^version = "([^"]+)".*/\1/p' .linter-base/Project.toml | head -1)"
          julia_version="$(julia --version | sed -n 's/^julia version \([^ ]*\).*/\1/p')"
          set +e
          julia --startup-file=no --project=.linter-base -m AgentRuleLint check \
            --diff "${base_sha}" \
            --config-from "origin/${GITHUB_BASE_REF}" \
            --format human 2>&1 | tee "${DOGFOOD_DIR}/human.log"
          human_exit="${PIPESTATUS[0]}"
          julia --startup-file=no --project=.linter-base -m AgentRuleLint check \
            --diff "${base_sha}" \
            --config-from "origin/${GITHUB_BASE_REF}" \
            --format json \
            --output "${DOGFOOD_DIR}/dogfood.jsonl" 2> "${DOGFOOD_DIR}/json.stderr"
          json_exit=$?
          set -e
          jq -n \
            --argjson pr_number "${PR_NUMBER}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg merge_base_sha "${base_sha}" \
            --arg base_ref "${GITHUB_BASE_REF}" \
            --arg linter_commit_sha "${linter_sha}" \
            --arg package_version "${pkg_version}" \
            --arg julia_version "${julia_version}" \
            --argjson human_exit_code "${human_exit}" \
            --argjson json_exit_code "${json_exit}" \
            '{
              pr_number: $pr_number,
              head_sha: $head_sha,
              merge_base_sha: $merge_base_sha,
              base_ref: $base_ref,
              linter_commit_sha: $linter_commit_sha,
              package_version: $package_version,
              julia_version: $julia_version,
              human_exit_code: $human_exit_code,
              json_exit_code: $json_exit_code
            }' > "${DOGFOOD_DIR}/meta.json"
          exit "${human_exit}"

      - name: Upload dogfood findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dogfood-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/dogfood/
          retention-days: 90
          if-no-files-found: error
