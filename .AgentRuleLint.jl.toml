agentrulelint_version = "=0.1.0"
default_format = "human"
max_hits_per_rule = 20
presets = ["unsafe-boundary/strict"]

[rules.expect-audit]
level = "forbid"
on_allow_rule = "warn"

[rules.manifest-sync]
level = "deny"
intent = "Keep git-tracked manifests aligned with Project.toml resolve sections and workspace subprojects."
do_not = "Change [deps], [compat], [sources], or [workspace] without updating the paired manifest and project_hash."

[rules.silent-catch]
level = "deny"
intent = "Surface try/catch blocks that hide failures instead of rethrowing or throwing on unhandled paths."
do_not = "Use empty catch bodies, log-only handlers, or partial branches without rethrow to silence errors."
warn_counts_as_handling = false

[rules.test-integrity]
level = "deny"
intent = "Block hollow or weakened tests that always pass or shrink CI coverage."
do_not = "Trivially true @test expressions, broad @test_throws Exception/ErrorException, extra @test_skip/@test_broken in a diff, removed test includes or testsets, early exit() in the suite driver, or looser isapprox/≈ tolerances vs base."

[rules.unsafe-boundary]
level = "warn"
allow_modules = []
allow_globs = []
intent = "Keep runtime evaluation and FFI inside reviewed boundaries in this package."
do_not = "Add allow_globs or allow_modules rather than hiding eval, ccall, or unsafe_* calls."

[rules."unsafe-boundary/strict"]
level = "warn"

[rules.protected-paths]
level = "forbid"
paths = [
  { glob = "AGENTS.md", reason = "Agent instructions must not be weakened by agents." },
  { glob = "CONTRIBUTING.md", reason = "Contribution and admission policy must not be weakened by agents." },
  { glob = "SECURITY.md", reason = "Security policy must not be weakened by agents." },
  { glob = ".agents/**", reason = "Agent skills must not be weakened by agents." },
  { glob = ".github/**", reason = "CI workflows, composite actions, scripts, tool pins, and repository settings must not be weakened by agents." },
  { glob = ".cursor/**", reason = "Agent environment setup must not be changed by agents." },
  { glob = ".claude/**", reason = "Agent configuration and skill links must not be changed by agents." },
  { glob = "test/mutation/mutation_lib.jl", reason = "This file decides whether a mutation harness passes (control run, verify exit contract, and child-process flags)." },
  { glob = "test/mutation/run_all_lib.jl", reason = "This file decides whether mutation run_all passes (shard selection, job parallelism, and aggregate pass/fail)." },
  { glob = "test/mutation/run_all.jl", reason = "This entrypoint carries mutation_run_all_main's exit code to CI; weakening exit() would pass the job when harnesses fail." },
  { glob = "test/shard_lib.jl", reason = "This file decides which mutation harnesses and test files each CI shard runs (shard parsing and round-robin selection)." },
  { glob = "test/shard_select.jl", reason = "This file decides which Pkg.test files each CI shard runs." },
  { glob = "test/parallel_testsuite_config.jl", reason = "This file lists the test files excluded from the default Pkg.test suite." },
  { glob = "test/mutation/**/*.jl", on = ["deleted", "renamed"], reason = "Mutation harness scripts and detectors must not be removed or renamed away without review." },
  { glob = "scripts/whitespace-gate.sh", reason = "This script decides whether the whitespace CI job and the pre-push gate pass." },
]

[[project_rules]]
id = "no-internal-codename"
level = "deny"
paths = ["test/corpus/**", "src/**"]
forbid_literals = ["INTERNAL_CODENAME"]
intent = "Keep internal codenames out of public package files."
do_not = "Split or dynamically concatenate forbidden strings to bypass the check."
